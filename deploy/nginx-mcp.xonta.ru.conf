# Add inside the existing `server { server_name mcp.xonta.ru; ... }` block, next to /customs/.
# The MCP endpoint becomes https://mcp.xonta.ru/max/mcp

location /max/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}

# Server card: https://mcp.xonta.ru/max/.well-known/mcp/server-card.json
