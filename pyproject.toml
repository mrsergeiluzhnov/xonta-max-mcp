[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xonta-max-mcp"
version = "0.1.0"
description = "MCP server for building bots and mini-apps for the MAX messenger (max.ru): current Bot API facts, code checks, Telegram migration, deep links, test fixtures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sergei Luzhnov" }]
keywords = ["mcp", "max", "max-messenger", "max.ru", "bot-api", "mini-apps", "telegram-migration", "russia", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries",
  "Natural Language :: Russian",
  "Natural Language :: English",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://xonta.ru"
Repository = "https://github.com/mrsergeiluzhnov/xonta-max-mcp"
Issues = "https://github.com/mrsergeiluzhnov/xonta-max-mcp/issues"

[project.scripts]
xonta-max-mcp = "xonta_max.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xonta_max"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
